  <style>

    :root {
      --black: #0a0a0a;
      --ember: #F5A623;
      --deep-red: #8B0000;
      --crimson: #C0392B;

      --white: #FFFFFF;
      --off-white: #F0EDE8;

      --gray: #1a1a1a;
      --gray-mid: #2a2a2a;
      --gray-text: #888880;

      --steel: #3A6EA5;
      --steel-deep: #1F3A5F;
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      background: var(--black);
      color: var(--white);

      font-family: 'Crimson Pro', serif;

      overflow-x: hidden;

      min-height: 100vh;
    }


    .wrap {
      display: flex;
      flex-direction: column;

      min-height: 100vh;
    }


    /* =========================================================
       HEADER
       ========================================================= */


    header {
      text-align: center;

      padding:
        2.2rem
        1.5rem
        1.8rem;

      border-bottom:
        1px solid rgba(255,255,255,0.06);

      position: relative;

      z-index: 10;

      background: var(--black);
    }


    .mark {
      font-size: 1.4rem;
    }


    h1 {
      font-family: 'Bebas Neue', sans-serif;

      font-size:
        clamp(2rem, 6vw, 3.2rem);

      letter-spacing: 0.07em;

      margin-top: 0.35rem;
    }


    .tagline {
      font-family: 'Space Mono', monospace;

      font-size: 0.68rem;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      color: var(--gray-text);

      margin-top: 0.45rem;
    }


    /* =========================================================
       HOMEPAGE
       ========================================================= */


    .home-stage {
      flex: 1;

      display: grid;

      grid-template-columns:
        minmax(0, 1.15fr)
        minmax(320px, 0.85fr);

      min-height: 620px;

      border-bottom:
        1px solid rgba(255,255,255,0.06);
    }


    /* =========================================================
       LIVING FRAME
       ========================================================= */


    .emblem-stage {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 620px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          rgba(245,166,35,0.08),
          transparent 52%
        ),
        linear-gradient(
          135deg,
          #080808,
          #111111
        );

      transition:
        background 0.6s ease;
    }


    /* ---------------------------------------------------------
       SUBTLE EMBER PARTICLES
       --------------------------------------------------------- */


    .emblem-stage::before {
      content: '';

      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(245,166,35,0.35) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(192,57,43,0.22) 0 1px,
          transparent 1.5px
        );

      background-size:
        90px 90px,
        130px 130px;

      background-position:
        20px 40px,
        70px 10px;

      opacity: 0.16;

      animation:
        emberDrift 14s linear infinite;
    }


    @keyframes emberDrift {

      from {
        transform: translateY(20px);
      }

      to {
        transform: translateY(-70px);
      }

    }


    /* =========================================================
       NEON PERIMETER
       ========================================================= */


    /*
      Slightly larger copy of the flame silhouette.

      It sits BEHIND .emblem-art.

      Because the artwork layer sits on top of it,
      only the enlarged edges remain visible.

      This gives us the neon perimeter without
      painting the solid logo over the artwork.
    */


    .ember-outline {
      position: absolute;

      width:
        min(53.5vw, 534px);

      height: 90%;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          #A90000 0%,
          #E23818 38%,
          #F5A623 65%,
          #FFB52E 100%
        );

      -webkit-mask-image:
        url("emberline-emblem.png");

      mask-image:
        url("emberline-emblem.png");

      -webkit-mask-size: contain;
      mask-size: contain;

      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;

      -webkit-mask-position: center;
      mask-position: center;

      opacity: 0.95;

      filter:
        brightness(1.25)
        saturate(1.35)

        drop-shadow(
          0 0 2px
          rgba(255,220,150,0.92)
        )

        drop-shadow(
          0 0 7px
          rgba(245,166,35,0.82)
        )

        drop-shadow(
          0 0 16px
          rgba(245,166,35,0.50)
        )

        drop-shadow(
          0 0 30px
          rgba(192,57,43,0.32)
        );

      transition:
        filter 0.45s ease,
        opacity 0.45s ease;
    }


    /* =========================================================
       ART INSIDE FLAME
       ========================================================= */


    .emblem-art {
      position: absolute;

      width:
        min(52vw, 520px);

      height: 88%;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 2;

      overflow: hidden;

      opacity: 0.82;

      -webkit-mask-image:
        url("emberline-emblem.png");

      mask-image:
        url("emberline-emblem.png");

      -webkit-mask-size: contain;
      mask-size: contain;

      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;

      -webkit-mask-position: center;
      mask-position: center;

      filter:
        saturate(1.05)
        contrast(1.08);

      transition:
        opacity 0.45s ease,
        filter 0.45s ease;
    }


    /* ---------------------------------------------------------
       SLIDES
       --------------------------------------------------------- */


    .emblem-slide {
      position: absolute;

      inset: 0;

      opacity: 0;

      background-size: cover;

      background-position: center;

      transition:
        opacity 1s ease;
    }


    .emblem-slide.active {
      opacity: 1;
    }


    /* ---------------------------------------------------------
       SLIDE CHANGE BREATH / PULSE
       --------------------------------------------------------- */


    .emblem-art.frame-pulse {
      filter:
        saturate(1.15)
        contrast(1.1)
        brightness(1.08)

        drop-shadow(
          0 0 28px
          rgba(245,166,35,0.42)
        );
    }


    .ember-outline.frame-pulse {
      filter:
        brightness(1.45)
        saturate(1.45)

        drop-shadow(
          0 0 3px
          rgba(255,220,150,1)
        )

        drop-shadow(
          0 0 10px
          rgba(245,166,35,0.95)
        )

        drop-shadow(
          0 0 24px
          rgba(245,166,35,0.68)
        )

        drop-shadow(
          0 0 42px
          rgba(192,57,43,0.42)
        );
    }


    /* =========================================================
       STUDIO MODE
       ========================================================= */


    .emblem-stage.studio-mode {

      background:

        radial-gradient(
          circle at center,
          rgba(245,166,35,0.16),
          transparent 52%
        ),

        linear-gradient(
          135deg,
          #080808,
          #111111
        );

    }


    .emblem-stage.studio-mode
    .emblem-art {

      opacity: 0.9;

      filter:

        saturate(1.12)
        contrast(1.08)

        drop-shadow(
          0 0 20px
          rgba(245,166,35,0.25)
        );

    }


    .emblem-stage.studio-mode
    .ember-outline {

      opacity: 1;

      filter:

        brightness(1.42)
        saturate(1.5)

        drop-shadow(
          0 0 3px
          rgba(255,220,140,1)
        )

        drop-shadow(
          0 0 9px
          rgba(245,166,35,0.95)
        )

        drop-shadow(
          0 0 20px
          rgba(245,166,35,0.65)
        )

        drop-shadow(
          0 0 36px
          rgba(192,57,43,0.45)
        );

    }


    /* =========================================================
       CREATIVES MODE
       ========================================================= */


    .emblem-stage.creatives-mode {

      background:

        radial-gradient(
          circle at center,
          rgba(58,110,165,0.18),
          transparent 52%
        ),

        linear-gradient(
          135deg,
          #080808,
          #101216
        );

    }


    .emblem-stage.creatives-mode
    .emblem-art {

      opacity: 0.9;

      filter:

        saturate(1.05)
        contrast(1.08)

        drop-shadow(
          0 0 22px
          rgba(58,110,165,0.34)
        );

    }


    .emblem-stage.creatives-mode
    .ember-outline {

      opacity: 0.95;

      background:

        linear-gradient(
          135deg,
          #1F3A5F,
          #3A6EA5,
          #76A9DC
        );

      filter:

        brightness(1.28)
        saturate(1.35)

        drop-shadow(
          0 0 3px
          rgba(170,210,250,0.95)
        )

        drop-shadow(
          0 0 10px
          rgba(58,110,165,0.8)
        )

        drop-shadow(
          0 0 24px
          rgba(58,110,165,0.52)
        );

    }


    /* =========================================================
       SITE CHOICES
       ========================================================= */


    .home-choices {
      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        4rem
        clamp(2rem, 5vw, 5rem);

      background:

        linear-gradient(
          180deg,
          #0d0d0d,
          #090909
        );

      position: relative;

      z-index: 4;
    }


    .home-choice {
      display: block;

      position: relative;

      text-decoration: none;

      color: var(--white);

      padding:
        2.6rem 0;

      transition:
        transform 0.25s ease,
        color 0.25s ease;
    }


    .home-choice:hover {
      transform:
        translateX(8px);
    }


    .choice-label {
      font-family:
        'Space Mono',
        monospace;

      font-size: 0.62rem;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: var(--gray-text);

      margin-bottom: 0.65rem;
    }


    .home-choice h2 {
      font-family:
        'Bebas Neue',
        sans-serif;

      font-size:
        clamp(
          3rem,
          7vw,
          5.6rem
        );

      line-height: 0.92;

      letter-spacing: 0.04em;

      margin-bottom: 0.8rem;

      transition:
        color 0.25s ease;
    }


    .home-choice p {
      font-size: 1rem;

      color:
        rgba(
          255,
          255,
          255,
          0.68
        );

      margin-bottom: 1rem;
    }


    .home-choice span {
      display: inline-block;

      font-family:
        'Space Mono',
        monospace;

      font-size: 0.62rem;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      color: var(--ember);

      transition:
        transform 0.25s ease,
        letter-spacing 0.25s ease;
    }


    .home-choice:hover span {
      transform:
        translateX(6px);

      letter-spacing:
        0.19em;
    }


    .choice-divider {
      height: 1px;

      background:
        rgba(
          255,
          255,
          255,
          0.09
        );
    }


    .studio-choice:hover h2 {
      color: var(--ember);
    }


    .creatives-choice:hover h2 {
      color: var(--steel);
    }


    .creatives-choice span {
      color: var(--steel);
    }


    /* =========================================================
       FOOTER
       ========================================================= */


    footer {
      text-align: center;

      padding: 1.5rem;

      font-family:
        'Space Mono',
        monospace;

      font-size: 0.62rem;

      letter-spacing: 0.1em;

      color: var(--gray-text);

      background: var(--black);
    }


    .footer-social {
      margin-top: 0.75rem;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 1rem;
    }


    .footer-social a {
      color: var(--ember);

      text-decoration: none;

      opacity: 0.9;

      font-size: 0.68rem;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }


    .footer-social a:hover {
      opacity: 1;

      color: var(--white);
    }


    .footer-social span {
      color:
        rgba(
          255,
          255,
          255,
          0.2
        );
    }


    /* =========================================================
       MOBILE
       ========================================================= */


    @media (max-width: 820px) {


      header {

        padding:
          1.8rem
          1.25rem
          1.4rem;

      }


      .home-stage {

        grid-template-columns:
          1fr;

        min-height: unset;

      }


      .emblem-stage {

        min-height: 52vh;

      }


      .emblem-art {

        width:
          min(68vw, 430px);

        height: 86%;

      }


      .ember-outline {

        width:
          min(70vw, 444px);

        height: 88%;

      }


      .home-choices {

        padding:
          1rem
          1.5rem
          2rem;

      }


      .home-choice {

        padding:
          2rem 0;

      }


      .home-choice:hover {

        transform: none;

      }


      .home-choice h2 {

        font-size:
          clamp(
            3rem,
            16vw,
            4.8rem
          );

      }


      .footer-social {

        gap: 0.8rem;

      }

    }


    @media (max-width: 480px) {


      .emblem-stage {

        min-height: 45vh;

      }


      .emblem-art {

        width: 72vw;

        height: 84%;

      }


      .ember-outline {

        width: 74vw;

        height: 86%;

      }


      .home-choice {

        padding:
          1.7rem 0;

      }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */


    @media (
      prefers-reduced-motion:
      reduce
    ) {


      *,
      *::before,
      *::after {

        scroll-behavior:
          auto !important;

        transition-duration:
          0.01ms !important;

        animation-duration:
          0.01ms !important;

      }


      .emblem-stage::before {

        animation: none;

      }

    }

  </style>

</head>


<body>

<script>

(function () {


  /* =========================================================
     ELEMENTS
     ========================================================= */


  const slides =
    Array.from(
      document.querySelectorAll(
        '.emblem-slide'
      )
    );


  const emblemArt =
    document.querySelector(
      '.emblem-art'
    );


  const emberOutline =
    document.querySelector(
      '.ember-outline'
    );


  const emblemStage =
    document.querySelector(
      '.emblem-stage'
    );


  const studioChoice =
    document.querySelector(
      '.studio-choice'
    );


  const creativesChoice =
    document.querySelector(
      '.creatives-choice'
    );


  /* =========================================================
     STATE
     ========================================================= */


  let currentIndex = 0;

  let timer = null;

  let pulseTimer = null;


  /*
    Slides 0–2:
    Studio.

    Slides 3–5:
    Creatives.
  */


  const groups = {


    studio: [
      0,
      1,
      2
    ],


    creatives: [
      3,
      4,
      5
    ]


  };


  /* =========================================================
     SHOW SLIDE
     ========================================================= */


  function showSlide(index) {


    slides.forEach(
      function (slide) {

        slide.classList.remove(
          'active'
        );

      }
    );


    if (!slides[index]) {
      return;
    }


    slides[index]
      .classList
      .add(
        'active'
      );


    currentIndex = index;


    /*
      Restart the little
      Living Frame breath.
    */


    emblemArt
      .classList
      .remove(
        'frame-pulse'
      );


    emberOutline
      .classList
      .remove(
        'frame-pulse'
      );


    void emblemArt.offsetWidth;


    emblemArt
      .classList
      .add(
        'frame-pulse'
      );


    emberOutline
      .classList
      .add(
        'frame-pulse'
      );


    if (pulseTimer) {

      clearTimeout(
        pulseTimer
      );

    }


    pulseTimer =
      setTimeout(
        function () {


          emblemArt
            .classList
            .remove(
              'frame-pulse'
            );


          emberOutline
            .classList
            .remove(
              'frame-pulse'
            );


        },
        420
      );


  }


  /* =========================================================
     STOP
     ========================================================= */


  function stopSequence() {


    if (timer) {


      clearInterval(
        timer
      );


      timer = null;


    }


  }


  /* =========================================================
     GROUP SEQUENCE
     ========================================================= */


  function startSequence(indices) {


    stopSequence();


    let position = 0;


    showSlide(
      indices[position]
    );


    timer =
      setInterval(
        function () {


          position =
            (
              position + 1
            )
            %
            indices.length;


          showSlide(
            indices[position]
          );


        },
        1800
      );


  }


  /* =========================================================
     FULL EMBERLINE SEQUENCE
     ========================================================= */


  function startAllSlides() {


    stopSequence();


    timer =
      setInterval(
        function () {


          currentIndex =
            (
              currentIndex + 1
            )
            %
            slides.length;


          showSlide(
            currentIndex
          );


        },
        2000
      );


  }


  /* =========================================================
     DESKTOP INTERACTION
     ========================================================= */


  if (
    window.matchMedia(
      '(hover: hover)'
    ).matches
  ) {


    studioChoice
      .addEventListener(
        'mouseenter',
        function () {


          emblemStage
            .classList
            .add(
              'studio-mode'
            );


          emblemStage
            .classList
            .remove(
              'creatives-mode'
            );


          startSequence(
            groups.studio
          );


        }
      );


    studioChoice
      .addEventListener(
        'mouseleave',
        function () {


          emblemStage
            .classList
            .remove(
              'studio-mode'
            );


          startAllSlides();


        }
      );


    creativesChoice
      .addEventListener(
        'mouseenter',
        function () {


          emblemStage
            .classList
            .add(
              'creatives-mode'
            );


          emblemStage
            .classList
            .remove(
              'studio-mode'
            );


          startSequence(
            groups.creatives
          );


        }
      );


    creativesChoice
      .addEventListener(
        'mouseleave',
        function () {


          emblemStage
            .classList
            .remove(
              'creatives-mode'
            );


          startAllSlides();


        }
      );


  }


  /* =========================================================
     START
     ========================================================= */


  startAllSlides();


})();

</script>


</body>

</html>
